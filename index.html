<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 13 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About [Me]</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite movie?
        <select id="movie-answer">
          <option value="movie1"> 10 things I hate about you</option>
          <option value="movie2"> The notebook</option>
          <option value="movie3"> Unknown Man</option>
          <option value="movie4"> The Godfather</option>
        </select>
      </label>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result"></div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        📖 What is my favorite book?
        <select id="book-answer">
          <option value="book1">A Tree Grows In Brooklyn</option>
          <option value="book2">The Housemaid</option>
          <option value="book3">The Housemaid's Secret</option>
          <option value="book4">Harry Potter  </option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>

        //Movie Question jQuery Code
        $("#movie-form").on("submit", function (event) {
          event.preventDefault();

          var $answer = $("#movie-answer");
          var answer = $answer.val();

          if (answer === "movie1") {
            $("#movie-result").text("Yay you did it!");
          } else {
            $("#movie-result").text("Try Again!");
          }
        });

        //Book Question jQuery Code
        $("#book-form").on("submit", function (event) {
          event.preventDefault();

          var $answer = $("#book-answer");
          var answer = $answer.val();

          if (answer === "book2") {
            $("#book-result").text("YESSSS!");
          } else {
            $("#book-result").text("Try Again!");
          }
        });
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
